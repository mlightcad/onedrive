<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneDrive CAD Viewer — MLightCAD</title>
    <meta
      name="description"
      content="Open DWG and DXF drawings from OneDrive in your browser with MLightCAD. Per-file access only; drawings stay on your device."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Sign-in / boot (centered) -->
      <main id="auth-layout" class="auth-layout" hidden>
        <div data-site-nav></div>

        <div class="auth-layout__body">
          <header class="app-header">
            <p class="app-header__eyebrow" data-i18n="eyebrow">MLightCAD · OneDrive</p>
            <h1 data-i18n="heading">OneDrive CAD Viewer</h1>
            <p data-i18n="lead">
              Open DWG/DXF from OneDrive in your browser. Only files you
              choose; nothing is uploaded to our servers.
            </p>
          </header>

          <section id="boot-panel" class="panel center-panel" hidden>
            <div class="spinner" aria-hidden="true"></div>
            <p data-i18n="loading">Loading…</p>
          </section>

          <section id="auth-panel" class="panel auth-panel" hidden>
            <h2 id="auth-title" data-i18n="signInContinue">Sign in to continue</h2>
            <div id="config-warning" class="alert alert-warning" hidden></div>
            <button id="sign-in-btn" type="button" class="btn-microsoft" disabled>
              <span class="btn-microsoft__icon" aria-hidden="true">
                <svg width="21" height="21" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                  <rect x="1" y="1" width="9" height="9" fill="#f25022" />
                  <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
                  <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
                  <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
                </svg>
              </span>
              <span class="btn-microsoft__label" data-i18n="signInMicrosoft">Sign in with Microsoft</span>
            </button>
            <p class="auth-footer muted">
              <a href="%BASE_URL%privacy.html" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy Policy</a>
            </p>
          </section>
        </div>

        <div data-site-footer></div>
      </main>

      <!-- Authenticated: toolbar + fullscreen viewer -->
      <section id="workspace-panel" class="workspace" hidden>
        <div class="toolbar">
          <div class="toolbar-left">
            <span id="file-name" class="file-name" title="">No file selected</span>
            <span id="file-status" class="file-status muted" hidden></span>
          </div>
          <div class="toolbar-actions">
            <div class="user-chip" id="user-chip" hidden>
              <img id="user-avatar" alt="" width="28" height="28" />
              <span id="user-name"></span>
            </div>
            <a
              class="toolbar-privacy"
              href="%BASE_URL%privacy.html"
              target="_blank"
              rel="noopener"
              data-i18n="privacy"
              >Privacy</a
            >
            <button id="pick-file-btn" type="button" class="btn btn-primary" data-i18n="pickFile">
              Choose from OneDrive
            </button>
            <button id="sign-out-btn" type="button" class="btn btn-ghost" data-i18n="signOut">
              Sign Out
            </button>
          </div>
        </div>

        <div id="viewer-host" class="viewer-host">
          <div id="welcome" class="welcome">
            <p data-i18n="chooseFile">Choose a DWG or DXF file from OneDrive.</p>
          </div>

          <div id="viewer-overlay" class="viewer-overlay" hidden>
            <div id="overlay-loading" class="overlay-block">
              <div class="spinner" aria-hidden="true"></div>
              <p data-i18n="overlayLoading">Loading file from OneDrive…</p>
            </div>
            <div id="overlay-error" class="overlay-block" hidden>
              <p id="overlay-error-text"></p>
              <button id="retry-btn" type="button" class="btn btn-primary" data-i18n="retry">Retry</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
