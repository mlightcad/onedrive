name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deploy secrets
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.MSAL_CLIENT_ID }}
        run: |
          if [ -z "$VITE_MSAL_CLIENT_ID" ]; then
            echo "::error::MSAL_CLIENT_ID secret is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build with environment variables
        run: |
          export VITE_MSAL_TENANT_ID="${VITE_MSAL_TENANT_ID:-common}"
          if [ -z "$VITE_MSAL_REDIRECT_URI" ]; then
            export VITE_MSAL_REDIRECT_URI="https://mlightcad.com/onedrive/"
          fi
          pnpm build
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.MSAL_TENANT_ID }}
          VITE_MSAL_REDIRECT_URI: ${{ secrets.MSAL_REDIRECT_URI }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
